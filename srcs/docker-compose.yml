volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/ldesboui/data/mariadb
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/ldesboui/data/wordpress
      o: bind
      type: none
  adminer:
    name: adminer
    driver: local
    driver_opts:
      device: /home/ldesboui/data/adminer
      o: bind
      type: none
  static_site:
    name: static_site
    driver: local
    driver_opts:
      device: /home/ldesboui/data/static_site
      o: bind
      type: none

services:
  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp
    networks:
      - inception
    restart: on-failure 
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env

  static_site:
    container_name: static_site
    build: ./requirements/bonus/static_site
    networks:
      - inception
    restart: on-failure
    volumes:
      - static_site:/var/www/html

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    volumes:
      - adminer:/var/www/html
    depends_on:
      - mariadb
      - wordpress
    networks:
      - inception
    restart: on-failure
    env_file:
      - .env

  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: on-failure
    env_file: 
      - .env

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    networks: 
      - inception
    volumes:
      - wordpress:/var/www/html
      - static_site:/var/www/html/static_site
    depends_on:
      - wordpress
      - static_site
    restart: on-failure
    env_file: .env

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    ports:
      - "3306:3306"
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    restart: on-failure
    expose:
      - "3306"
    env_file: .env

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    restart: on-failure
    expose:
      - "9000"
    env_file: .env
networks:
  inception:
    name: inception
    driver: bridge
